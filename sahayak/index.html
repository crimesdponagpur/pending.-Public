<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>सहायक</title>
<meta name="theme-color" content="#0b1f4b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="सहायक">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap">
<script src="config.js"></script>
<style>
/* सहायक: Drive मधील सर्व Sheet / Excel वरून प्रश्नांची उत्तरे. आकडे सर्व्हरवरील कोड मोजतो, AI फक्त प्रश्न समजतो व लिहितो. */
:root{
  --bg:#f3f5f9;--card:#fff;--ink:#0f172a;--ink2:#334155;--muted:#64748b;--line:#e2e8f0;
  --navy:#0b1f4b;--pri:#1d4ed8;--pri-l:#eaf0ff;--gold:#a8740c;--gold-l:#fdf6e3;
  --ok:#047857;--ok-l:#e7f6ef;--bad:#b91c1c;--bad-l:#fdecec;--pii:#7c3aed;
  --sh:0 1px 2px rgba(15,23,42,.05),0 2px 10px rgba(15,23,42,.07);--r:16px;
  --font:"Mukta","Noto Sans Devanagari","Mangal",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1020;--card:#121a2e;--ink:#e7ecf5;--ink2:#c3cbe0;--muted:#8b97b3;--line:#22304d;
  --navy:#0b1736;--pri:#7aa2ff;--pri-l:#17244a;--gold:#e0b44a;--gold-l:#2a2310;
  --ok:#4ccf97;--ok-l:#11291f;--bad:#ff7b7b;--bad-l:#331616;--pii:#c4a5ff;--sh:0 2px 10px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1020;--card:#121a2e;--ink:#e7ecf5;--ink2:#c3cbe0;--muted:#8b97b3;--line:#22304d;
  --navy:#0b1736;--pri:#7aa2ff;--pri-l:#17244a;--gold:#e0b44a;--gold-l:#2a2310;
  --ok:#4ccf97;--ok-l:#11291f;--bad:#ff7b7b;--bad-l:#331616;--pii:#c4a5ff;--sh:0 2px 10px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;display:flex;align-items:center;gap:10px}
header.top .t{flex:1;min-width:0}
header.top b{display:block;font-size:18px;line-height:1.2}
header.top small{opacity:.75;font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center}
.menu{position:absolute;right:12px;top:calc(56px + env(safe-area-inset-top,0px));background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);min-width:230px;overflow:hidden;z-index:30}
.menu button{display:flex;gap:10px;align-items:center;width:100%;padding:12px 14px;border:0;background:none;text-align:left}
.menu button:hover{background:var(--pri-l)}
main{padding:14px 0 150px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;margin:12px 0}
.hello h2{margin:4px 0 4px;font-size:20px}
.hello p{margin:0 0 10px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14.5px;text-align:left}
.chip:hover{border-color:var(--pri);color:var(--pri)}
.q{display:flex;justify-content:flex-end;margin:16px 0 6px}
.q div{background:var(--pri);color:#fff;border-radius:16px 16px 4px 16px;padding:9px 14px;max-width:85%;white-space:pre-wrap;word-wrap:break-word}
.a{background:var(--card);border:1px solid var(--line);border-radius:4px 16px 16px 16px;box-shadow:var(--sh);padding:12px 16px;margin:6px 0 14px}
.a .md{overflow-wrap:break-word}
.md h1,.md h2,.md h3{font-size:17px;margin:12px 0 6px}
.md p{margin:6px 0}
.md ul,.md ol{margin:6px 0;padding-left:22px}
.md code{background:var(--pri-l);padding:1px 5px;border-radius:5px;font-size:.92em}
.md hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.tw{overflow-x:auto;margin:8px 0;border:1px solid var(--line);border-radius:10px}
.md table{border-collapse:collapse;width:100%;font-size:14.5px}
.md th,.md td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:var(--pri-l);font-weight:600;white-space:nowrap}
.md td.n,.md th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.md td:first-child{min-width:4.5em}
.md tr:last-child td{border-bottom:0}
.md tr.tot td{font-weight:700;background:var(--gold-l)}
a.s{display:inline-block;font-size:11.5px;font-weight:700;line-height:1;padding:3px 5px;margin:0 1px;border-radius:6px;background:var(--pri-l);color:var(--pri);text-decoration:none;vertical-align:2px}
.pii{color:var(--pii);font-weight:600}
.ver{display:flex;gap:8px;align-items:flex-start;border-radius:10px;padding:8px 10px;margin-top:10px;font-size:14px}
.ver.ok{background:var(--ok-l);color:var(--ok)}
.ver.warn{background:var(--bad-l);color:var(--bad)}
.ver svg{width:18px;height:18px;margin-top:2px}
details.src{margin-top:8px;font-size:14px}
details.src summary{cursor:pointer;color:var(--muted);font-weight:600}
.srcl{list-style:none;margin:6px 0 0;padding:0}
.srcl li{padding:7px 0;border-top:1px dashed var(--line);color:var(--ink2)}
.srcl li b{color:var(--pri)}
.srcl a{color:var(--pri)}
.srcl small{display:block;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 11px;font-size:14px}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.cost{font-size:12px;color:var(--muted);margin-left:auto;align-self:center}
.work{color:var(--ink2);font-size:14.5px}
.work li{margin:2px 0}
.work .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:var(--bad-l);color:var(--bad);border-radius:12px;padding:10px 12px;margin:8px 0}
footer.ask{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 22%);padding:18px 0 calc(12px + env(safe-area-inset-bottom,0px));z-index:10}
.box{display:flex;gap:8px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:6px 6px 6px 14px}
.box textarea{flex:1;border:0;outline:0;background:none;resize:none;max-height:160px;min-height:26px;padding:8px 0;line-height:1.45}
.send{width:44px;height:44px;border-radius:14px;border:0;background:var(--pri);color:#fff;display:grid;place-items:center;flex:none}
.send:disabled{opacity:.45}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.field{display:block;margin:12px 0}
.field span{display:block;font-weight:600;margin-bottom:4px}
.field input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px}
.field small{color:var(--muted)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.stat div{background:var(--bg);border-radius:12px;padding:8px 10px}
.stat b{display:block;font-size:20px}
.stat small{color:var(--muted)}
.fl{list-style:none;padding:0;margin:0}
.fl li{padding:9px 0;border-top:1px solid var(--line)}
.fl li small{display:block;color:var(--muted)}
@media (max-width:480px){.md th,.md td{padding:5px 8px}.md table{font-size:14px}}
@media print{header.top,footer.ask,.acts,.hello,.q,details.src,.ver{display:none!important}.a{border:0;box-shadow:none}body{background:#fff}}
</style>
</head>
<body>
<header class="top">
  <div class="t"><b>सहायक</b><small id="sub">Drive मधील माहितीवरून अचूक उत्तरे</small></div>
  <button class="ib" id="newBtn" title="नवीन संवाद" aria-label="नवीन संवाद"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="ib" id="menuBtn" title="मेनू" aria-label="मेनू"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
  <div class="menu" id="menu" hidden>
    <button data-m="files"><svg class="i" viewBox="0 0 24 24"><path d="M4 4h6l2 2h8v14H4z"/></svg>वाचलेल्या फाइल्स</button>
    <button data-m="reindex"><svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>फाइल यादी ताजी करा</button>
    <button data-m="settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>सेटिंग्ज</button>
  </div>
</header>

<main class="wrap" id="chat"></main>

<section class="wrap" id="settings" hidden>
  <div class="card">
    <h2 style="margin:0 0 4px;font-size:19px">सर्व्हर जोडा</h2>
    <p style="margin:0;color:var(--ink2)">तुमच्या Google खात्यातील "सहायक" Apps Script ची Web app लिंक व प्रवेश कोड. ही माहिती फक्त या फोनमध्ये राहते.</p>
    <label class="field"><span>सर्व्हर लिंक</span><input id="sUrl" placeholder="https://script.google.com/macros/s/…/exec" inputmode="url" autocomplete="off"></label>
    <label class="field"><span>प्रवेश कोड</span><input id="sKey" placeholder="उदा. 7F3A9C21BE" autocomplete="off" autocapitalize="characters"></label>
    <div class="acts"><button class="btn pri" id="sSave">जतन करा व तपासा</button><button class="btn" id="sBack">मागे</button></div>
    <div id="sMsg"></div>
  </div>
</section>

<section class="wrap" id="files" hidden>
  <div class="card">
    <div style="display:flex;align-items:center;gap:8px"><h2 style="margin:0;font-size:19px;flex:1">वाचलेल्या फाइल्स</h2><button class="btn" id="fBack">मागे</button></div>
    <div id="fBody"><p class="work"><span class="spin"></span>आणत आहे…</p></div>
  </div>
</section>

<footer class="ask" id="askBar">
  <div class="wrap">
    <div class="box">
      <textarea id="inp" rows="1" placeholder="प्रश्न विचारा… उदा. बोरी चे 1 वर्षावरील प्रलंबित किती?" enterkeyhint="send"></textarea>
      <button class="send" id="sendBtn" aria-label="पाठवा"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
    <div class="hint">आकडे फाइलमधून कोडने मोजले जातात • नावे व मोबाईल AI ला दिसत नाहीत</div>
  </div>
</footer>

<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var LS = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  var SUGGEST = [
    'सर्व पो.स्टे. चे प्रलंबित गुन्हे प्रकारनिहाय तक्ता',
    'बोरी चे 1 वर्षावरील प्रलंबित IPC/BNS गुन्हे कोणते?',
    'CC क्रमांक बाकी असलेली प्रकरणे पो.स्टे. निहाय',
    'तपास अधिकारी निहाय प्रलंबित गुन्ह्यांची संख्या',
    'या महिन्याच्या noting मध्ये खून व चोरीचे दाखल / उघड',
    'प्रलंबित यादी व MCR रजिस्टर मधील संख्येत फरक आहे का?',
    'जुने प्रलंबित गुन्हे निकाली काढण्याबाबत ठाणेदारांना पत्र तयार करा'
  ];
  var S = load();
  var busy = false, info = null;

  function load() {
    try { var s = JSON.parse(LS.get('sh-chat') || 'null'); if (s && s.api) return s; } catch (e) {}
    return { api: [], items: [], pii: {} };
  }
  function save() {
    var s = JSON.stringify(S);
    if (!LS.set('sh-chat', s)) { S.api = []; LS.set('sh-chat', JSON.stringify(S)); }
  }
  function apiUrl() { return LS.get('sh-url') || window.SH_API || ''; }

  function call(fn, a) {
    var u = apiUrl();
    if (!u) return Promise.reject(new Error('आधी सेटिंग्जमध्ये सर्व्हर लिंक टाका'));
    return fetch(u, { method: 'POST', redirect: 'follow', cache: 'no-store', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: LS.get('sh-key') || '', fn: fn, a: a || {} }) })
      .then(function (r) { if (!r.ok) throw new Error('सर्व्हर उत्तर देत नाही (' + r.status + ')'); return r.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.e || 'त्रुटी'); return j.d; });
  }

  /* ---------- मजकूर ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function unmaskText(s) { return String(s || '').replace(/«[^»\s]{1,12}-[a-z0-9]{3,8}»/g, function (t) { return S.pii[t] != null ? S.pii[t] : t; }); }
  function inline(s) {
    s = esc(s);
    s = s.replace(/«([^»\s]{1,12}-[a-z0-9]{3,8})»/g, function (m, t) { var v = S.pii['«' + t + '»']; return v != null ? '<span class="pii">' + esc(v) + '</span>' : m; });
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');
    s = s.replace(/\[(S\d+)\]/g, '<a class="s" href="#" data-s="$1">$1</a>');
    return s;
  }
  function isNumCell(t) { return /^\s*[-+]?[\d०-९][\d०-९,.\s%]*\s*$/.test(t); }
  function splitRow(l) { l = l.trim().replace(/^\|/, '').replace(/\|$/, ''); return l.split('|').map(function (c) { return c.trim(); }); }
  function md(src) {
    var lines = String(src || '').replace(/\r/g, '').split('\n'), out = [], i = 0, list = null;
    function closeList() { if (list) { out.push('</' + list + '>'); list = null; } }
    while (i < lines.length) {
      var l = lines[i];
      if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
        closeList();
        var head = splitRow(l), rows = []; i += 2;
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(splitRow(lines[i])); i++; }
        var t = '<div class="tw"><table><thead><tr>' + head.map(function (h, k) { return '<th' + (rows.length && rows.every(function (r) { return !r[k] || isNumCell(r[k].replace(/\*\*|\[S\d+\]/g, '')); }) ? ' class="n"' : '') + '>' + inline(h) + '</th>'; }).join('') + '</tr></thead><tbody>';
        rows.forEach(function (r) {
          var tot = /^(\*\*)?\s*(एकूण|एकुण|total|बेरीज)/i.test(r[0] || '');
          t += '<tr' + (tot ? ' class="tot"' : '') + '>' + r.map(function (c) { return '<td' + (isNumCell(c.replace(/\*\*|\[S\d+\]/g, '')) ? ' class="n"' : '') + '>' + inline(c) + '</td>'; }).join('') + '</tr>';
        });
        out.push(t + '</tbody></table></div>');
        continue;
      }
      var m;
      if ((m = l.match(/^(#{1,4})\s+(.*)/))) { closeList(); out.push('<h3>' + inline(m[2]) + '</h3>'); }
      else if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { closeList(); out.push('<hr>'); }
      else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inline(m[1]) + '</li>'); }
      else if ((m = l.match(/^\s*(\d+)[.)]\s+(.*)/))) { if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inline(m[2]) + '</li>'); }
      else if (!l.trim()) closeList();
      else { closeList(); out.push('<p>' + inline(l) + '</p>'); }
      i++;
    }
    closeList();
    return out.join('');
  }
  function tablesOf(text) {
    var lines = unmaskText(text).split('\n'), tabs = [], i = 0;
    while (i < lines.length) {
      if (/^\s*\|.*\|\s*$/.test(lines[i]) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
        var t = [splitRow(lines[i])]; i += 2;
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { t.push(splitRow(lines[i])); i++; }
        tabs.push(t.map(function (r) { return r.map(function (c) { return c.replace(/\*\*/g, '').replace(/\s*\[S\d+\]/g, ''); }); }));
      } else i++;
    }
    return tabs;
  }
  function plain(text) { return unmaskText(text).replace(/\s*\[S\d+\]/g, '').replace(/\*\*/g, ''); }

  /* ---------- चित्र ---------- */
  var IC = {
    ok: '<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    warn: '<svg class="i" viewBox="0 0 24 24"><path d="M12 3l10 18H2zM12 10v5M12 18v.5"/></svg>',
    copy: '<svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
    xls: '<svg class="i" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8l8 8M16 8l-8 8"/></svg>',
    print: '<svg class="i" viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M7 14h10v7H7z"/></svg>',
    redo: '<svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>'
  };

  /* ---------- दाखवणे ---------- */
  function render() {
    var c = $('#chat'), h = '';
    if (!S.items.length) {
      h += '<div class="card hello"><h2>नमस्कार 🙏</h2><p>प्रलंबित यादी, noting, MCR, RDP… Drive मधील फाइल्सबद्दल काहीही विचारा. उत्तराखाली कोणती फाइल, कोणती शीट व कोणत्या ओळी हे दिसेल.</p><div class="chips">' +
        SUGGEST.map(function (s) { return '<button class="chip">' + esc(s) + '</button>'; }).join('') + '</div></div>';
      if (!apiUrl()) h += '<div class="err">सर्व्हर जोडलेला नाही. वर ⋮ → सेटिंग्ज मध्ये लिंक व प्रवेश कोड टाका.</div>';
    }
    S.items.forEach(function (it, k) { h += it.role === 'user' ? '<div class="q"><div>' + esc(it.text) + '</div></div>' : answerHtml(it, k); });
    c.innerHTML = h;
  }
  function answerHtml(it, k) {
    if (it.work) return '<div class="a work" id="work"><ul style="margin:0;padding-left:4px;list-style:none">' + it.work.map(function (w, j) { return '<li>' + (j === it.work.length - 1 ? '<span class="spin"></span>' : '✓ ') + esc(w) + '</li>'; }).join('') + '</ul></div>';
    if (it.error) return '<div class="err">' + esc(it.error) + ' <button class="btn" data-retry="' + k + '" style="margin-left:6px">' + IC.redo + 'पुन्हा प्रयत्न</button></div>';
    var h = '<div class="a" data-k="' + k + '"><div class="md">' + md(it.text) + '</div>';
    var v = it.verify;
    if (v && v.checked) {
      if (v.unverified && v.unverified.length) h += '<div class="ver warn">' + IC.warn + '<div>हे आकडे फाइलमधील निकालात थेट सापडले नाहीत, कृपया मूळ फाइलमध्ये तपासा: <b>' + esc(v.unverified.join(', ')) + '</b></div></div>';
      else h += '<div class="ver ok">' + IC.ok + '<div>उत्तरातील सर्व ' + v.checked + ' आकडे फाइलमधील निकालाशी जुळले.</div></div>';
    }
    var src = (it.sources || []).filter(function (s) { return s.kind !== 'calc' || true; });
    if (src.length) {
      h += '<details class="src"><summary>आधार: ' + src.length + ' संदर्भ</summary><ul class="srcl">' + src.map(function (s) {
        if (s.kind === 'calc') return '<li id="src-' + k + '-' + s.id + '"><b>' + s.id + '</b> हिशेब: ' + esc(s.what) + '</li>';
        return '<li id="src-' + k + '-' + s.id + '"><b>' + s.id + '</b> ' + (s.url ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.file) + '</a>' : esc(s.file)) + ' • शीट <b style="color:inherit">' + esc((s.sheet || '').trim()) + '</b>' +
          '<small>' + esc(s.what || '') + (s.matched != null ? ' • जुळलेल्या ओळी: ' + s.matched : '') + (s.rows ? ' • शीट ओळी: ' + esc(s.rows) : '') + (s.modified ? ' • फाइल बदल: ' + esc(s.modified) : '') + '</small></li>';
      }).join('') + '</ul></details>';
    }
    h += '<div class="acts"><button class="btn" data-act="copy" data-k="' + k + '">' + IC.copy + 'कॉपी</button>';
    if (tablesOf(it.text).length) h += '<button class="btn" data-act="xls" data-k="' + k + '">' + IC.xls + 'Excel</button>';
    h += '<button class="btn" data-act="print" data-k="' + k + '">' + IC.print + 'प्रिंट / PDF</button>';
    if (it.cost) h += '<span class="cost">' + esc(it.cost) + '</span>';
    return h + '</div></div>';
  }
  function scrollEnd() { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }

  /* ---------- प्रश्न ---------- */
  var PRICE = { 'claude-opus-5-5': [4, 20, 0.2], 'claude-sonnet-5-5': [2, 10, 0.2], 'claude-haiku-5-5': [0.1, 0.5, 0.01], 'claude-fable-5-1': [10, 50, 0.25] };
  function ask(q, retryFrom) {
    if (busy) return;
    if (!apiUrl()) { show('settings'); return; }
    busy = true; $('#sendBtn').disabled = true;
    var turn = retryFrom || { q: q, api: S.api.slice(), sources: [], steps: [], usage: { in: 0, cached: 0, out: 0 } };
    if (!retryFrom) S.items.push({ role: 'user', text: q });
    else S.items.pop();
    var work = { role: 'ai', work: ['प्रश्न समजून घेत आहे'] };
    S.items.push(work); render(); scrollEnd();
    var rounds = 0;
    function step() {
      rounds++;
      if (rounds > 24) return Promise.reject(new Error('खूप पावले झाली; प्रश्न थोडा सोपा करून विचारा'));
      return call('ask', { messages: turn.api, q: turn.q }).then(function (d) {
        turn.q = null; turn.api = d.messages;
        for (var t in d.pii) S.pii[t] = d.pii[t];
        turn.sources = turn.sources.concat(d.sources || []);
        if (d.usage) { turn.usage.in += d.usage.in; turn.usage.cached += d.usage.cached; turn.usage.out += d.usage.out; turn.usage.model = d.usage.model; }
        if (!d.done) { work.work = work.work.concat(d.steps.length ? d.steps : ['विचार करत आहे']); render(); scrollEnd(); return step(); }
        return d;
      });
    }
    step().then(function (d) {
      S.items.pop();
      var u = turn.usage, p = PRICE[(u.model || '').replace(/-\d{8}$/, '')] || PRICE['claude-opus-5-5'];
      var usd = ((u.in - u.cached) * p[0] + u.cached * p[2] + u.out * p[1]) / 1e6;
      var used = {}; (d.answer.match(/\[S\d+\]/g) || []).forEach(function (x) { used[x.slice(1, -1)] = 1; });
      var srcs = turn.sources.filter(function (s) { return used[s.id]; });
      if (!srcs.length) srcs = turn.sources;
      S.items.push({ role: 'ai', text: d.answer, verify: d.verify, sources: srcs, cost: 'खर्च ≈ ₹' + (usd * 88).toFixed(1) });
      S.api = turn.api; save();
    }).catch(function (e) {
      S.items.pop();
      S.items.push({ role: 'ai', error: e.message || String(e), retry: turn });
      if (/KEY:/.test(e.message)) show('settings');
    }).then(function () { busy = false; $('#sendBtn').disabled = false; render(); scrollEnd(); });
  }

  /* ---------- पडदे ---------- */
  function show(v) {
    $('#chat').hidden = v !== 'chat'; $('#askBar').hidden = v !== 'chat';
    $('#settings').hidden = v !== 'settings'; $('#files').hidden = v !== 'files';
    $('#menu').hidden = true;
    if (v === 'settings') { $('#sUrl').value = apiUrl(); $('#sKey').value = LS.get('sh-key') || ''; $('#sMsg').innerHTML = ''; }
    if (v === 'files') loadFiles();
    window.scrollTo(0, 0);
  }
  function subLine() {
    if (!info) return;
    $('#sub').textContent = info.files + ' फाइल्स • ' + info.tables + ' शीट' + (info.built ? ' • यादी ' + new Date(info.built).toLocaleDateString('en-GB') : ' • यादी बनलेली नाही') + (info.ai ? '' : ' • AI key नाही');
  }
  function refreshInfo() { if (!apiUrl()) return Promise.resolve(); return call('info').then(function (d) { info = d; subLine(); return d; }).catch(function () {}); }
  function loadFiles() {
    var b = $('#fBody');
    b.innerHTML = '<p class="work"><span class="spin"></span>आणत आहे…</p>';
    Promise.all([call('info'), call('files')]).then(function (r) {
      info = r[0]; subLine();
      var fs = r[1].slice().sort(function (x, y) { return y.modified - x.modified; });
      b.innerHTML = '<div class="stat"><div><b>' + info.files + '</b><small>फाइल्स</small></div><div><b>' + info.tables + '</b><small>शीट</small></div><div><b>' + (info.mask ? 'चालू' : 'बंद') + '</b><small>नावे लपवणे</small></div><div><b style="font-size:15px">' + esc(info.model) + '</b><small>AI</small></div></div>' +
        (info.pending ? '<div class="err">अजून ' + info.pending + ' फाइल्स वाचायच्या बाकी आहेत; काही मिनिटांत आपोआप होतील.</div>' : '') +
        '<ul class="fl">' + fs.map(function (f) {
          return '<li><a href="' + esc(f.url) + '" target="_blank" rel="noopener">' + esc(f.name) + '</a><small>' + esc(f.path) + ' • बदल ' + new Date(f.modified).toLocaleDateString('en-GB') + '</small>' +
            (f.err ? '<small style="color:var(--bad)">' + esc(f.err) + '</small>' : '<small>' + f.sheets.map(function (s) { return esc(s.name.trim()) + ' (' + s.rows + ')'; }).join(', ') + '</small>') + '</li>';
        }).join('') + '</ul>';
    }).catch(function (e) { b.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
  }
  function reindex() {
    show('files');
    $('#fBody').innerHTML = '<p class="work"><span class="spin"></span>Drive मधील फाइल्स वाचत आहे… (पहिल्यांदा काही मिनिटे लागू शकतात)</p>';
    call('reindex').then(function (r) {
      if (r.busy) { $('#fBody').innerHTML = '<div class="err">' + esc(r.msg) + '</div>'; return; }
      loadFiles();
    }).catch(function (e) { $('#fBody').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
  }

  /* ---------- कृती ---------- */
  function copyText(t) {
    if (navigator.clipboard) return navigator.clipboard.writeText(t);
    var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); return Promise.resolve();
  }
  function toast(el, msg) { var o = el.innerHTML; el.innerHTML = IC.ok + msg; setTimeout(function () { el.innerHTML = o; }, 1500); }
  function csv(tabs) {
    return '﻿' + tabs.map(function (t) { return t.map(function (r) { return r.map(function (c) { c = String(c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\r\n'); }).join('\r\n\r\n');
  }
  function download(name, text, type) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: type })); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function printAnswer(it) {
    var w = window.open('', '_blank');
    if (!w) { window.print(); return; }
    w.document.write('<!doctype html><html lang="mr"><meta charset="utf-8"><title>सहायक</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&display=swap"><style>body{font:16px/1.6 Mukta,"Noto Sans Devanagari",sans-serif;max-width:760px;margin:24px auto;padding:0 18px;color:#000}table{border-collapse:collapse;width:100%}th,td{border:1px solid #888;padding:4px 8px;text-align:left}td.n,th.n{text-align:right}tr.tot td{font-weight:700}.tw{margin:8px 0}h3{font-size:17px}</style><body>' +
      md(plain(it.text)) + '<script>setTimeout(function(){print()},600)<\/script></body></html>');
    w.document.close();
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button,a.s'); if (!t) { if (!e.target.closest('#menu')) $('#menu').hidden = true; return; }
    if (t.classList.contains('chip')) { ask(t.textContent); return; }
    if (t.matches('a.s')) {
      e.preventDefault();
      var card = t.closest('.a'), k = card && card.getAttribute('data-k'), li = document.getElementById('src-' + k + '-' + t.getAttribute('data-s'));
      if (li) { li.closest('details').open = true; li.scrollIntoView({ behavior: 'smooth', block: 'center' }); li.style.background = 'var(--pri-l)'; setTimeout(function () { li.style.background = ''; }, 1500); }
      return;
    }
    if (t.hasAttribute('data-retry')) { var it0 = S.items[+t.getAttribute('data-retry')]; if (it0 && it0.retry) ask(null, it0.retry); return; }
    var act = t.getAttribute('data-act');
    if (act) {
      var it = S.items[+t.getAttribute('data-k')];
      if (act === 'copy') copyText(plain(it.text)).then(function () { toast(t, 'कॉपी झाले'); });
      if (act === 'xls') download('सहायक_तक्ता.csv', csv(tablesOf(it.text)), 'text/csv;charset=utf-8');
      if (act === 'print') printAnswer(it);
      return;
    }
    var m = t.getAttribute('data-m');
    if (m === 'files') show('files'); else if (m === 'reindex') reindex(); else if (m === 'settings') show('settings');
  });
  $('#menuBtn').onclick = function (e) { e.stopPropagation(); $('#menu').hidden = !$('#menu').hidden; };
  $('#newBtn').onclick = function () { if (busy) return; S = { api: [], items: [], pii: {} }; save(); show('chat'); render(); };
  $('#sBack').onclick = function () { show('chat'); render(); };
  $('#fBack').onclick = function () { show('chat'); render(); };
  $('#sSave').onclick = function () {
    var u = $('#sUrl').value.trim(), k = $('#sKey').value.trim().toUpperCase();
    if (!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(u)) { $('#sMsg').innerHTML = '<div class="err">लिंक script.google.com/macros/s/…/exec अशी असावी</div>'; return; }
    LS.set('sh-url', u); LS.set('sh-key', k);
    $('#sMsg').innerHTML = '<p class="work"><span class="spin"></span>तपासत आहे…</p>';
    call('info').then(function (d) {
      info = d; subLine();
      var warn = [];
      if (!d.ai) warn.push('सर्व्हरवर ANTHROPIC_KEY नाही');
      if (!d.folders) warn.push('FOLDER_IDS (Drive फोल्डर) टाकलेले नाहीत');
      if (!d.built) warn.push('फाइल यादी अजून बनलेली नाही: ⋮ → "फाइल यादी ताजी करा"');
      $('#sMsg').innerHTML = '<div class="ver ' + (warn.length ? 'warn' : 'ok') + '">' + (warn.length ? IC.warn : IC.ok) + '<div>' + (warn.length ? 'जोडले, पण: ' + warn.join(' • ') : 'जोडले! ' + d.files + ' फाइल्स, ' + d.tables + ' शीट तयार.') + '</div></div>';
    }).catch(function (e) { $('#sMsg').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
  };
  var inp = $('#inp');
  function grow() { inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 160) + 'px'; }
  inp.addEventListener('input', grow);
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); $('#sendBtn').click(); } });
  $('#sendBtn').onclick = function () { var q = inp.value.trim(); if (!q || busy) return; inp.value = ''; grow(); ask(q); };

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  render(); refreshInfo();
})();
</script>
</body>
</html>
