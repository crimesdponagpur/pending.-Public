<!DOCTYPE html>
<html lang="mr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1a3f">
<title>प्रलंबित प्रकरण व्यवस्थापन</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== डिझाइन प्रणाली: रंग, अंतर, अक्षरे ===== */
:root{
  --navy:#0a1a3f;--navy2:#123170;--navy3:#1b4aa8;--gold:#f2b01e;--gold2:#ffd77a;--saffron:#f97316;
  --bg:#f3f6fb;--bg2:#e9eef7;--card:#fff;--card2:#f8fafd;--ink:#0f172a;--ink2:#334155;--muted:#64748b;--line:#e3e9f2;--line2:#d3dbe8;
  --brand:var(--acc-l,#1d4ed8);--brand-ink:#fff;--soft:color-mix(in srgb,var(--brand) 10%,#fff);--focus:color-mix(in srgb,var(--brand) 45%,#fff);
  --sd1:#0a1a3f;--sd2:#0d2459;--sd3:#0b1d49;
  --ok:#047857;--ok-bg:#e3f6ec;--warn:#b45309;--warn-bg:#fff3df;--bad:#b91c1c;--bad-bg:#fde8e8;--info:#1d4ed8;--info-bg:#e6eeff;
  --a1:#60a5fa;--a2:#2563eb;--a3:#f59e0b;--a4:#dc2626;
  --t-IPC:#2563eb;--t-SLL:#0d9488;--t-PRO:#9333ea;--t-AD:#64748b;
  --g15:#1d4ed8;--g6:#60a5fa;--gO6:#14b8a6;--gJ:#f59e0b;--gD:#a855f7;--gM:#64748b;
  --ps-BELA:#0d9488;--ps-BORI:#2563eb;--ps-MIDC:#d97706;
  --sh1:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.04);--sh2:0 6px 24px rgba(15,23,42,.08);--sh3:0 18px 50px rgba(15,23,42,.22);
  --r:16px;--r2:12px;--r3:10px;--fs:15px;--side:252px;--top:64px;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0a1020;--bg2:#0f172b;--card:#121b30;--card2:#16213a;--ink:#e7ecf6;--ink2:#c3cde0;--muted:#93a1bb;--line:#1f2b46;--line2:#2a385a;
  --brand:var(--acc-d,#7aa2ff);--brand-ink:#0a1020;--soft:color-mix(in srgb,var(--brand) 18%,#121b30);--focus:color-mix(in srgb,var(--brand) 50%,#121b30);
  --ok:#4ade80;--ok-bg:#0f2e1f;--warn:#fbbf24;--warn-bg:#33260c;--bad:#f87171;--bad-bg:#3a1414;--info:#93b4ff;--info-bg:#17264a;
  --a1:#7cc0ff;--a2:#5b8cff;--a3:#fbbf24;--a4:#f87171;
  --t-IPC:#6f9bff;--t-SLL:#2dd4bf;--t-PRO:#c084fc;--t-AD:#94a3b8;
  --g15:#6f9bff;--g6:#9cc3ff;--gO6:#2dd4bf;--gJ:#fbbf24;--gD:#c084fc;--gM:#94a3b8;
  --ps-BELA:#2dd4bf;--ps-BORI:#7aa2ff;--ps-MIDC:#fbbf24;
  --sh1:0 1px 2px rgba(0,0,0,.3);--sh2:0 6px 24px rgba(0,0,0,.35);--sh3:0 18px 50px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#0a1020;--bg2:#0f172b;--card:#121b30;--card2:#16213a;--ink:#e7ecf6;--ink2:#c3cde0;--muted:#93a1bb;--line:#1f2b46;--line2:#2a385a;
  --brand:var(--acc-d,#7aa2ff);--brand-ink:#0a1020;--soft:color-mix(in srgb,var(--brand) 18%,#121b30);--focus:color-mix(in srgb,var(--brand) 50%,#121b30);
  --ok:#4ade80;--ok-bg:#0f2e1f;--warn:#fbbf24;--warn-bg:#33260c;--bad:#f87171;--bad-bg:#3a1414;--info:#93b4ff;--info-bg:#17264a;
  --a1:#7cc0ff;--a2:#5b8cff;--a3:#fbbf24;--a4:#f87171;
  --t-IPC:#6f9bff;--t-SLL:#2dd4bf;--t-PRO:#c084fc;--t-AD:#94a3b8;
  --g15:#6f9bff;--g6:#9cc3ff;--gO6:#2dd4bf;--gJ:#fbbf24;--gD:#c084fc;--gM:#94a3b8;
  --ps-BELA:#2dd4bf;--ps-BORI:#7aa2ff;--ps-MIDC:#fbbf24;
  --sh1:0 1px 2px rgba(0,0,0,.3);--sh2:0 6px 24px rgba(0,0,0,.35);--sh3:0 18px 50px rgba(0,0,0,.55);color-scheme:dark}
:root[data-fs=l]{--fs:17px}
:root[data-fs=xl]{--fs:19px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:var(--fs)/1.5 "Noto Sans Devanagari","Mukta","Mangal","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
svg.i.s{width:16px;height:16px}
svg.i.l{width:26px;height:26px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:.87em}
.hide{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
:root[data-anim=off] *{animation-duration:.01ms!important;transition-duration:.01ms!important}

/* ===== Splash (ND चे चित्र) ===== */
#splash{position:fixed;inset:0;z-index:200;color:#fff;display:flex;flex-direction:column;align-items:center;overflow:hidden;
  background:radial-gradient(1200px 600px at 50% 18%,#1b3f8f 0%,rgba(18,49,112,.6) 38%,transparent 70%),linear-gradient(180deg,#071433 0%,#0a1d4a 45%,#081536 100%);transition:opacity .5s ease,visibility .5s}
#splash.out{opacity:0;visibility:hidden}
#splash .grid{position:absolute;inset:0;opacity:.35;background-image:radial-gradient(rgba(120,170,255,.55) 1px,transparent 1.4px);background-size:22px 22px;-webkit-mask:radial-gradient(520px 320px at 50% 26%,#000 0%,transparent 75%);mask:radial-gradient(520px 320px at 50% 26%,#000 0%,transparent 75%)}
#splash .swoosh{position:absolute;left:-10%;top:30%;width:60%;height:220px;border-top:3px solid rgba(249,115,22,.55);border-radius:50%;transform:rotate(12deg);filter:blur(.5px);opacity:.7}
#splash .swoosh.g{top:34%;border-color:rgba(34,197,94,.45)}
#splash .swoosh.r{left:auto;right:-14%;top:33%;transform:rotate(-12deg);border-color:rgba(96,165,250,.55)}
#splash .ver{position:absolute;top:max(14px,env(safe-area-inset-top));right:18px;font-size:13px;opacity:.75;border-bottom:1px solid rgba(255,255,255,.35);padding-bottom:3px;letter-spacing:.5px}
#splash .city-pin{position:absolute;top:21%;right:max(8%,calc(50% - 300px));font-size:12px;letter-spacing:1.5px;color:#9cc3ff;display:flex;align-items:center;gap:6px;opacity:0;animation:fadeUp .8s .9s var(--ease) forwards}
#splash .city-pin i{width:12px;height:12px;border-radius:50%;border:2px solid #9cc3ff;box-shadow:0 0 0 4px rgba(156,195,255,.18);animation:ping 1.8s infinite}
.sp-in{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 16px;margin-top:max(5vh,28px)}
.sp-logo{position:relative;width:min(230px,46vw);aspect-ratio:380/300;animation:logoIn 1.1s var(--ease) both}
.sp-logo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 26px rgba(242,176,30,.35))}
.sp-logo:after{content:"";position:absolute;inset:0;-webkit-mask:var(--lm) center/contain no-repeat;mask:var(--lm) center/contain no-repeat;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.85) 50%,transparent 65%) -150% 0/250% 100% no-repeat;animation:shine 2.6s 1s ease-in-out infinite}
.sp-title{font-size:clamp(30px,7.2vw,56px);font-weight:800;margin:14px 0 0;line-height:1.15;letter-spacing:.3px;text-shadow:0 4px 18px rgba(0,0,0,.45);animation:fadeUp .8s .25s var(--ease) both}
.sp-city{font-size:clamp(24px,5.6vw,42px);font-weight:800;color:var(--gold);margin:0;line-height:1.2;text-shadow:0 2px 14px rgba(242,176,30,.35);animation:fadeUp .8s .35s var(--ease) both}
.sp-div{width:min(420px,80vw);height:2px;margin:12px 0 10px;background:linear-gradient(90deg,transparent,var(--gold),transparent);position:relative;animation:grow .9s .5s var(--ease) both}
.sp-div:after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;background:var(--gold);transform:translate(-50%,-50%);box-shadow:0 0 12px var(--gold)}
.sp-app{font-size:clamp(19px,4.4vw,32px);font-weight:600;animation:fadeUp .8s .55s var(--ease) both}
.sp-en{font-size:clamp(10px,2.2vw,14px);letter-spacing:.42em;color:#8fb6ff;margin-top:4px;animation:fadeUp .8s .62s var(--ease) both}
.sp-ps{font-size:clamp(16px,3.4vw,22px);margin-top:12px;display:flex;gap:16px;align-items:center;animation:fadeUp .8s .7s var(--ease) both}
.sp-ps b{font-weight:600}.sp-ps i{width:1px;height:18px;background:rgba(255,255,255,.5)}
.sp-bld{position:absolute;left:0;right:0;bottom:0;height:52vh;z-index:1;background:var(--bld) center 30%/cover no-repeat;-webkit-mask:linear-gradient(180deg,transparent 0%,#000 26%,#000 52%,transparent 92%);mask:linear-gradient(180deg,transparent 0%,#000 26%,#000 52%,transparent 92%);opacity:.95;animation:fadeIn 1.2s .2s both}
@media (min-aspect-ratio:4/3){.sp-bld{height:56vh;background-position:center 20%}}
.sp-bot{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));z-index:3;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px}
.sp-bar{width:min(440px,78vw);display:flex;align-items:center;gap:12px}
.sp-bar u{flex:1;height:14px;border-radius:10px;border:1.5px solid rgba(120,170,255,.65);padding:2px;background:rgba(5,15,40,.6);text-decoration:none;box-shadow:0 0 18px rgba(59,130,246,.35)}
.sp-bar u i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#1d6bff,#5fb0ff);box-shadow:0 0 12px #3b82f6;transition:width .45s var(--ease)}
.sp-bar span{font-size:13px;min-width:38px;font-variant-numeric:tabular-nums}
.sp-msg{font-size:14px;opacity:.9;min-height:21px}
.sp-feat{display:flex;gap:0;margin-top:14px;width:min(640px,96vw);justify-content:space-between}
.sp-feat div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:clamp(11px,2.6vw,14px);color:#dbe7ff;position:relative;opacity:0;animation:fadeUp .6s var(--ease) forwards}
.sp-feat div+div:before{content:"";position:absolute;left:0;top:8px;height:40px;width:1px;background:rgba(150,190,255,.35)}
.sp-feat svg.i{width:30px;height:30px;color:#9cc3ff;stroke-width:1.5}
@keyframes logoIn{0%{opacity:0;transform:scale(.6) rotate(-14deg);filter:blur(6px)}60%{opacity:1;transform:scale(1.04) rotate(2deg);filter:none}100%{transform:none}}
@keyframes shine{0%{background-position:-150% 0}55%,100%{background-position:250% 0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(156,195,255,.6)}100%{box-shadow:0 0 0 12px rgba(156,195,255,0)}}
@media (max-height:640px){.sp-feat{display:none}.sp-bld{height:44vh}}

/* ===== लॉगिन ===== */
#auth{position:fixed;inset:0;z-index:150;overflow:auto;color:#fff;background:radial-gradient(900px 500px at 50% 0%,#1b3f8f 0%,transparent 70%),linear-gradient(180deg,#071433,#0a1d4a 60%,#081536)}
#auth .sp-bld{height:46vh;opacity:.55;animation:none}
.au-wrap{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px 40px}
.au-head{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:18px}
.au-head img{width:118px;filter:drop-shadow(0 6px 20px rgba(242,176,30,.35))}
.au-head h1{font-size:24px;margin:8px 0 0;line-height:1.25}.au-head h1 b{color:var(--gold)}
.au-head p{margin:2px 0 0;color:#a9c4ff;font-size:14px}
.au-card{width:min(420px,100%);background:rgba(255,255,255,.97);color:#0f172a;border-radius:22px;padding:24px 22px 20px;box-shadow:0 30px 80px rgba(0,0,0,.45);animation:fadeUp .6s var(--ease) both}
:root[data-theme=dark] .au-card{background:rgba(18,27,48,.96);color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .au-card{background:rgba(18,27,48,.96);color:var(--ink)}}
.au-card h2{margin:0 0 2px;font-size:20px}
.au-card .muted{margin:0 0 14px}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:500}
.inp{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line2);border-radius:12px;padding:0 12px;background:var(--card);transition:border-color .15s,box-shadow .15s}
.inp:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent)}
.inp input{flex:1;border:0;outline:0;background:none;padding:12px 0;min-width:0;font-size:16px}
.inp svg{color:var(--muted)}
.inp button{border:0;background:none;padding:6px;cursor:pointer;color:var(--muted);border-radius:8px}
.au-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 16px;font-size:14px}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--brand)}
.au-msg{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:12px}
.au-foot{margin-top:16px;font-size:12.5px;color:#a9c4ff;text-align:center}
.bio{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0}
.bio button.big{width:86px;height:86px;border-radius:50%;border:2px solid var(--brand);background:var(--soft);color:var(--brand);cursor:pointer;display:flex;align-items:center;justify-content:center;animation:ping2 2s infinite}
.bio button.big svg{width:44px;height:44px}
@keyframes ping2{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 45%,transparent)}100%{box-shadow:0 0 0 18px transparent}}

/* ===== बटणे / chips ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:11px;padding:8px 14px;cursor:pointer;white-space:nowrap;text-decoration:none;font-weight:500;font-size:.94em;transition:transform .08s,background .15s,border-color .15s,box-shadow .15s;min-height:40px}
.btn:hover{border-color:var(--brand);box-shadow:var(--sh1)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:default}
.btn.p{background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 88%,#fff),var(--brand));border-color:var(--brand);color:var(--brand-ink);box-shadow:0 4px 14px color-mix(in srgb,var(--brand) 30%,transparent)}
.btn.g{background:var(--ok);border-color:var(--ok);color:#fff}
:root[data-theme=dark] .btn.g{color:#06210f}
.btn.d{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--line2))}
.btn.d.f{background:var(--bad);color:#fff}
.btn.gh{border-color:transparent;background:none}
.btn.gh:hover{background:var(--soft);box-shadow:none}
.btn.s{padding:5px 10px;min-height:34px;font-size:.87em;border-radius:9px}
.btn.ic{padding:0;width:40px}
.btn.ic.s{width:34px}
.btn.w{width:100%}
.btn.lg{min-height:50px;font-size:1.04em;border-radius:14px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;white-space:nowrap;font-weight:500;line-height:1.6}
.st-IO{background:var(--warn-bg);color:var(--warn)}
.st-CC{background:var(--info-bg);color:var(--info)}
.st-CLOSED{background:var(--ok-bg);color:var(--ok)}
.st-DEL{background:var(--bad-bg);color:var(--bad)}
.st-N{background:var(--bg2);color:var(--ink2)}
.age{font-weight:600;font-size:12.5px;border-radius:999px;padding:1px 9px;white-space:nowrap}
.age-a1{background:color-mix(in srgb,var(--a1) 16%,transparent);color:color-mix(in srgb,var(--a1) 75%,var(--ink))}
.age-a2{background:color-mix(in srgb,var(--a2) 14%,transparent);color:var(--a2)}
.age-a3{background:color-mix(in srgb,var(--a3) 18%,transparent);color:color-mix(in srgb,var(--a3) 70%,var(--ink))}
.age-a4{background:color-mix(in srgb,var(--a4) 14%,transparent);color:var(--a4)}
.psb{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.psb:before{content:"";width:9px;height:9px;border-radius:3px;background:var(--pc,var(--brand))}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--card);padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:.9em;border-radius:9px;white-space:nowrap;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--brand);color:var(--brand-ink);font-weight:600;box-shadow:var(--sh1)}
.seg button .n{font-size:11.5px;opacity:.85}

/* ===== App shell ===== */
#app{display:none}
#app.on{display:block;animation:fadeIn .35s ease both}
.side{position:fixed;left:0;top:0;bottom:0;width:var(--side);z-index:40;color:#dbe6ff;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--sd1) 0%,var(--sd2) 60%,var(--sd3) 100%);border-right:1px solid rgba(255,255,255,.06)}
.side:before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(120,170,255,.25) 1px,transparent 1.3px) 0 0/20px 20px;-webkit-mask:linear-gradient(180deg,#000,transparent 40%);mask:linear-gradient(180deg,#000,transparent 40%);opacity:.5;pointer-events:none}
.sd-brand{position:relative;display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.sd-brand img{width:52px;height:42px;object-fit:contain;filter:drop-shadow(0 3px 8px rgba(242,176,30,.35))}
.sd-brand b{display:block;font-size:15px;line-height:1.25;color:#fff}
.sd-brand span{display:block;font-size:12px;color:var(--gold2)}
.sd-nav{position:relative;flex:1;overflow:auto;padding:10px 10px}
.sd-sec{font-size:11px;letter-spacing:.12em;color:#7f97c9;margin:14px 10px 6px;text-transform:uppercase}
.nv{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:#c9d7f5;padding:9px 12px;border-radius:11px;cursor:pointer;text-align:left;font-size:14.5px;position:relative;transition:background .15s,color .15s}
.nv:hover{background:rgba(255,255,255,.07);color:#fff}
.nv.on{background:linear-gradient(90deg,rgba(242,176,30,.2),rgba(242,176,30,.04));color:#fff;font-weight:600}
.nv.on:before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--gold)}
.nv .n{margin-left:auto;font-size:11.5px;background:rgba(255,255,255,.12);border-radius:999px;padding:0 8px;font-variant-numeric:tabular-nums}
.nv.on .n{background:var(--gold);color:#1b1300}
.sd-user{position:relative;margin:10px;padding:10px;border-radius:14px;background:rgba(255,255,255,.06);display:flex;align-items:center;gap:10px;cursor:pointer;border:1px solid rgba(255,255,255,.06)}
.sd-user:hover{background:rgba(255,255,255,.1)}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:linear-gradient(135deg,#f59e0b,#f97316);font-size:15px;box-shadow:0 0 0 2px rgba(255,255,255,.2)}

.wrap{margin-left:var(--side);min-height:100vh}
.top{position:sticky;top:0;z-index:30;height:var(--top);display:flex;align-items:center;gap:12px;padding:0 22px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top h1{font-size:19px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.sbox{flex:0 1 460px;display:flex;align-items:center;gap:10px;height:42px;border:1px solid var(--line2);border-radius:12px;background:var(--card);padding:0 12px;color:var(--muted);cursor:text;transition:box-shadow .15s,border-color .15s}

.sbox span{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.top .acts{display:flex;align-items:center;gap:6px}
.top .av{width:36px;height:36px;cursor:pointer;font-size:14px}
.bell{position:relative}

main#main{padding:20px 22px 40px;max-width:1440px;margin:0 auto}

@media (max-width:999px){

  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;align-items:flex-end}
  .bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:4px 0;cursor:pointer;position:relative}

  .bnav .fab:after{display:none}
}
@media (min-width:1000px){.mob-only{display:none!important}}

/* ===== Cards ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px;box-shadow:var(--sh1);min-width:0}
.card h3{margin:0 0 12px;font-size:1.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
.card h3 .sp{flex:1}
.card h3 small{font-weight:400;color:var(--muted);font-size:.82em}
.card h3 svg.i{color:var(--brand)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(460px,100%),1fr));gap:16px;margin-bottom:16px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:16px;margin-bottom:16px}
.g2>.card,.g3>.card{margin:0}
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.hello h2{margin:0;font-size:1.5em;line-height:1.25;font-weight:800;letter-spacing:-.2px}
.hello p{margin:2px 0 0;color:var(--muted)}
.banner{display:flex;align-items:center;gap:12px;border-radius:var(--r);padding:12px 16px;margin-bottom:16px;background:linear-gradient(100deg,#ff9933 0%,#fff 50%,#138808 100%);color:#0a1a3f;font-weight:600;box-shadow:var(--sh1)}
.banner span{background:rgba(255,255,255,.82);border-radius:10px;padding:4px 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px;margin-bottom:16px}
.kpi{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;box-shadow:var(--sh1);transition:transform .18s var(--ease),box-shadow .18s;animation:fadeUp .5s var(--ease) both}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.kpi:after{content:"";position:absolute;right:-26px;top:-26px;width:96px;height:96px;border-radius:50%;background:color-mix(in srgb,var(--k) 10%,transparent)}
.kpi .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--k);background:color-mix(in srgb,var(--k) 14%,transparent);margin-bottom:10px}
.kpi b{display:block;font-size:2em;line-height:1.05;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.kpi span{display:block;color:var(--muted);font-size:.86em;margin-top:2px}
.kpi em{display:block;margin-top:4px;font-style:normal;font-size:12px;font-weight:600;color:var(--k)}
.kpi.alert{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.8em;color:var(--muted);font-weight:600;background:var(--card2);white-space:nowrap;letter-spacing:.2px}
thead th:first-child{border-top-left-radius:10px}thead th:last-child{border-top-right-radius:10px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;background:var(--card2)}
tbody tr{transition:background .12s}
tbody tr:hover{background:color-mix(in srgb,var(--brand) 4%,transparent)}
.lnk{color:var(--brand);cursor:pointer;text-decoration:none;font-weight:500}
.lnk:hover{text-decoration:underline}
.bar{display:flex;align-items:center;gap:8px;min-width:120px}
.bar u{flex:1;text-decoration:none;background:var(--bg2);border-radius:6px;height:8px;display:flex;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--a2),var(--a1));animation:grow .8s var(--ease) both;transform-origin:left}
.p12{color:var(--a4);font-weight:700}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty svg.i{width:40px;height:40px;opacity:.5;display:block;margin:0 auto 6px}

/* ===== Charts ===== */
.chart svg:not(.i){width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--ink);font-size:12.5px;font-family:inherit}
.chart .ax{fill:var(--muted);font-size:11px}
.chart .gl{stroke:var(--line);stroke-dasharray:3 4}
.chart rect.bb{transition:opacity .15s;cursor:pointer}
.chart rect.bb:hover{opacity:.8}
.chart .grow{animation:barIn .9s var(--ease) both;transform-box:fill-box;transform-origin:left}
@keyframes barIn{from{transform:scaleX(0)}to{transform:none}}
.chart .line{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.4s .2s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut svg{width:150px;height:150px;flex:none}
.donut circle.sg{transition:stroke-width .15s;cursor:pointer;animation:dash 1.1s var(--ease) both}
.donut circle.sg:hover{stroke-width:22}
@keyframes dash{from{stroke-dasharray:0 999}}
.donut .ct{font-size:26px;font-weight:800;fill:var(--ink)}
.donut .cs{font-size:11px;fill:var(--muted)}
.dl{flex:1;min-width:150px;display:flex;flex-direction:column;gap:6px;font-size:.9em}
.dl a{display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;cursor:pointer;padding:3px 6px;border-radius:8px}
.dl a:hover{background:var(--bg2)}
.dl a b{margin-left:auto;font-variant-numeric:tabular-nums}
.dl a small{color:var(--muted);width:38px;text-align:right}

/* ===== Lists ===== */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .sp{flex:1}
.fsel{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:7px 10px;max-width:100%;min-height:38px;font-size:.9em}
.fsearch{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:0 10px;flex:1;min-width:200px;min-height:38px}
.fsearch input{border:0;outline:0;background:none;flex:1;padding:7px 0;min-width:0}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 10px}
.fchips button{border:1px solid var(--line2);background:var(--soft);color:var(--brand);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
table.list{border-collapse:separate;border-spacing:0}
table.list thead th{position:sticky;top:0;z-index:2}
table.list td{font-size:.93em}
table.list tr{cursor:pointer}
table.list td.cr{white-space:nowrap;font-weight:700}
.cards{display:none}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh1);cursor:pointer;position:relative;overflow:hidden;animation:fadeUp .35s var(--ease) both}
.ccard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc)}
.ccard .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ccard .r1 b{font-size:1.05em}
.ccard .r1 .sp{flex:1}
.ccard .hd{font-weight:600;margin-top:4px}
.ccard .ln{color:var(--ink2);font-size:.9em;margin-top:2px;display:flex;gap:6px;align-items:flex-start}
.ccard .ln svg{margin-top:3px;color:var(--muted)}
@media (max-width:760px){.tblv{display:none}.cards{display:block}}
.more{text-align:center;margin:14px}

/* ===== Drawer / Sheet / Modal ===== */
.ov{position:fixed;inset:0;z-index:80;background:rgba(6,12,28,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 12px 20px;overflow:auto;animation:fadeIn .2s both}
.dlg{background:var(--card);border-radius:20px;max-width:640px;width:100%;padding:20px;box-shadow:var(--sh3);animation:pop .28s var(--ease) both;position:relative}
.dlg.wide{max-width:900px}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.dlg h2{margin:0 0 12px;font-size:1.15em;display:flex;align-items:center;gap:10px;padding-right:36px}
.dlg h2 svg.i{color:var(--brand)}
.dlg .x{position:absolute;top:14px;right:14px}
.ov.drw{justify-content:flex-end;padding:0;align-items:stretch}
.drawer{background:var(--bg);width:min(560px,100%);height:100%;overflow:auto;box-shadow:var(--sh3);animation:slideL .32s var(--ease) both;display:flex;flex-direction:column}
@keyframes slideL{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:760px){
  .ov{padding:0;align-items:flex-end}
  .dlg{border-radius:22px 22px 0 0;max-height:94vh;overflow:auto;animation:up .32s var(--ease) both;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .dlg:before{content:"";display:block;width:42px;height:5px;border-radius:3px;background:var(--line2);margin:-6px auto 12px}
  .ov.drw{align-items:flex-end}
  .drawer{width:100%;height:auto;max-height:94vh;border-radius:22px 22px 0 0;animation:up .32s var(--ease) both}
}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.dh{position:sticky;top:0;z-index:2;padding:16px 18px 14px;background:linear-gradient(120deg,var(--sd1),color-mix(in srgb,var(--sd2) 70%,var(--brand)));color:#fff}
.dh .r1{display:flex;align-items:center;gap:10px}
.dh h2{margin:0;font-size:1.35em;font-weight:800;flex:1}
.dh .btn.gh{color:#fff}.dh .btn.gh:hover{background:rgba(255,255,255,.12)}
.dh .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dh .meta .chip{background:rgba(255,255,255,.14);color:#fff}
.db{padding:16px 18px;flex:1}
.df{position:sticky;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.now{border-radius:14px;padding:12px 14px;background:linear-gradient(135deg,color-mix(in srgb,var(--warn) 12%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--warn) 30%,var(--line));margin-bottom:14px}
.now.CC{background:linear-gradient(135deg,color-mix(in srgb,var(--info) 12%,var(--card)),var(--card));border-color:color-mix(in srgb,var(--info) 30%,var(--line))}
.now.CLOSED{background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 12%,var(--card)),var(--card));border-color:color-mix(in srgb,var(--ok) 30%,var(--line))}
.now.DEL{background:linear-gradient(135deg,color-mix(in srgb,var(--bad) 12%,var(--card)),var(--card));border-color:color-mix(in srgb,var(--bad) 30%,var(--line))}
.now small{display:block;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.3px}
.now b{display:block;font-size:1.08em;margin-top:2px}
.now .ln{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:.9em;color:var(--ink2)}
.kv{display:grid;grid-template-columns:132px 1fr;gap:8px 12px;font-size:.93em;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.kv>div:nth-child(odd){color:var(--muted)}
.kv>div:nth-child(even){font-weight:500;word-break:break-word}
.tml{position:relative;margin:0;padding:0 0 0 4px;list-style:none}
.tml li{position:relative;padding:0 0 14px 30px}
.tml li:before{content:"";position:absolute;left:10px;top:22px;bottom:-2px;width:2px;background:var(--line2)}
.tml li:last-child:before{display:none}
.tml li i{position:absolute;left:0;top:2px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--tc,var(--brand));color:#fff;box-shadow:0 0 0 4px var(--bg)}
.tml li i svg.i{width:12px;height:12px;stroke-width:2.6}
.tml li b{display:block;font-size:.93em}
.tml li span{display:block;font-size:.84em;color:var(--muted)}
.tml li p{margin:3px 0 0;font-size:.88em;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;word-break:break-word}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form label{display:flex;flex-direction:column;font-size:.85em;color:var(--muted);gap:5px;min-width:0;font-weight:500}
.form label.full{grid-column:1/-1}
.form input,.form select,.form textarea{width:100%;min-width:0;border:1.5px solid var(--line2);background:var(--card);border-radius:11px;padding:9px 11px;color:var(--ink);font-size:16px;transition:border-color .15s,box-shadow .15s}
.form input:focus,.form select:focus,.form textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 16%,transparent)}
.form .req:after{content:" *";color:var(--bad)}
.form .hint{font-size:12.5px;color:var(--ok);font-weight:500}
.form .hint.w{color:var(--warn)}
.vin{position:relative;display:flex}
.vin>input,.vin>textarea{padding-right:42px}
.vin .mic{position:absolute;right:4px;top:4px;border:0;background:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px}
.vin .mic.on{color:#fff;background:var(--bad);animation:ping2 1.2s infinite}
@media (max-width:560px){.form{grid-template-columns:1fr}.kv{grid-template-columns:110px 1fr}}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.note{font-size:.87em;color:var(--muted);background:var(--card2);border:1px dashed var(--line2);border-radius:10px;padding:8px 12px;margin:8px 0}

/* ===== Command palette (शोध) ===== */
.pal{max-width:720px;padding:0;overflow:hidden}
.pal .ph{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.pal .ph input{flex:1;border:0;outline:0;background:none;font-size:18px;padding:8px 0;min-width:0}
.pal .ph svg.i{color:var(--brand)}
.pal .pr{max-height:min(62vh,560px);overflow:auto;padding:8px}
.pal .pg{font-size:11.5px;color:var(--muted);letter-spacing:.1em;margin:10px 10px 4px;font-weight:600}
.pal .it{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;cursor:pointer}

.pal .it .tx{flex:1;min-width:0}
.pal .it .tx b{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pal .it .tx span{display:block;font-size:.86em;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal .it .tx em{display:block;font-style:normal;font-size:.8em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal mark{background:color-mix(in srgb,var(--gold) 40%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.pal .pf{display:flex;gap:14px;padding:8px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);flex-wrap:wrap}
.pal .tips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 10px 12px}
.pal .tips button{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.87em}
@media (max-width:760px){.pal{border-radius:0;height:100%;max-height:none;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}.pal:before{display:none}.pal .pr{max-height:none;flex:1}.ov.palov{align-items:stretch}}

/* ===== Menu sheet ===== */
.menu{display:flex;flex-direction:column;gap:2px}
.menu button,.menu a{display:flex;align-items:center;gap:12px;border:0;background:none;padding:11px 12px;border-radius:12px;cursor:pointer;text-align:left;font-size:.98em;color:var(--ink);text-decoration:none}
.menu button:hover,.menu a:hover{background:var(--bg2)}
.menu button svg.i,.menu a svg.i{color:var(--brand)}
.menu .sep{height:1px;background:var(--line);margin:6px 4px}
.menu .rt{margin-left:auto;color:var(--muted);font-size:.85em}
.uhead{display:flex;align-items:center;gap:12px;padding:6px 4px 14px}
.uhead .av{width:52px;height:52px;font-size:20px}
.uhead b{display:block;font-size:1.1em}
.uhead span{display:block;color:var(--muted);font-size:.87em}

/* ===== Toast ===== */

function qa(root, sel) { return [].slice.call((root || document).querySelectorAll(sel)); }

function ic(n, c) { return '<svg class="i' + (c ? ' ' + c : '') + '"><use href="#i-' + n + '"/></svg>'; }
function fmtD(s) { return s && /^\d{4}-\d\d-\d\d/.test(s) ? s.slice(8, 10) + '-' + s.slice(5, 7) + '-' + s.slice(0, 4) : (s || ''); }
function fmtT(s) { return s ? fmtD(s) + ' ' + String(s).slice(11, 16) : ''; }
function nf(n) { return Number(n || 0).toLocaleString('en-IN'); }
function sGet(k) { try { return localStorage.getItem(k) || sessionStorage.getItem(k) || ''; } catch (e) { return ''; } }
function sSet(k, v, persist) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); if (v) (persist ? localStorage : sessionStorage).setItem(k, v); } catch (e) {} }
function lGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function lSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function remembered() { try { return !!localStorage.getItem('pl_tok'); } catch (e) { return false; } }
function initials(n) { n = String(n || '?').trim(); var p = n.split(/\s+/); return (p[0] || '?').charAt(0) + (p.length > 1 ? p[p.length - 1].charAt(0) : ''); }

function psB(p) { return '<span class="psb" style="--pc:var(--ps-' + esc(p) + ')">' + esc(psName(p)) + '</span>'; }

function applyPrefs() {
  PREF = Object.assign(PREF, lGet('pl_pref', {}));
  var r = document.documentElement;
  if (PREF.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', PREF.theme);
  if (PREF.fs) r.setAttribute('data-fs', PREF.fs); else r.removeAttribute('data-fs');
  if (!PREF.anim) r.setAttribute('data-anim', 'off'); else r.removeAttribute('data-anim');
  r.classList.toggle('pin', !!PREF.pin);
  if (PREF.acc && PREF.acc !== 'navy') r.setAttribute('data-acc', PREF.acc); else r.removeAttribute('data-acc');
  var tc = document.querySelector('meta[name=theme-color]'), ac = typeof ACC !== 'undefined' && ACC.filter(function (x) { return x[0] === (PREF.acc || 'navy'); })[0]; if (tc && ac) tc.setAttribute('content', ac[2]);
}
function savePref(k, v) { PREF[k] = v; lSet('pl_pref', PREF); applyPrefs(); }
/* आवाज: WebAudio ने बनवलेले सौम्य स्वर (बाहेरील फाइल नाही) */
var AC = null;
function snd(kind) {
  if (!PREF.snd) return;
  try {
    if (navigator.vibrate) navigator.vibrate(kind === 'err' ? [30, 40, 30] : 12);
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    var seq = { ok: [[880, .07], [1320, .12]], done: [[660, .08], [880, .08], [1320, .18]], err: [[180, .12], [140, .16]], alert: [[988, .12], [740, .12], [988, .18]], tap: [[1200, .03]] }[kind] || [[880, .08]];
    var t = AC.currentTime;
    seq.forEach(function (s) {
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = kind === 'err' ? 'square' : 'sine'; o.frequency.value = s[0];
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(kind === 'err' ? 0.05 : 0.12, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + s[1]);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + s[1] + 0.02); t += s[1] * 0.9;
    });
  } catch (e) {}
}
var TT = null;
function toast(m, err, undo) {
  var t = $('toast');
  t.innerHTML = (err ? ic('alert') : '<span class="ok"><svg class="i"><use href="#i-check"/></svg></span>') + '<span>' + esc(m) + '</span>' + (undo ? '<button class="btn s" style="margin-left:6px">पूर्ववत</button>' : '');
  t.className = 'on' + (err ? ' err' : '');
  if (undo) t.querySelector('button').onclick = function () { t.className = ''; undo(); };
  clearTimeout(TT); TT = setTimeout(function () { t.className = err ? 'err' : ''; }, err ? 6000 : (undo ? 5000 : 2800));
}

/* ---------- सर्व्हरशी संपर्क: Apps Script (google.script.run) / स्वतःचे ॲप (fetch) / नमुना ---------- */
function rpc(fn, args) {
  return new Promise(function (res, rej) {
    if (PL.mode === 'demo') { window.DEMO(fn, args).then(res, function (e) { rej(new Error(e.message || String(e))); }); return; }
    if (PL.mode === 'gas') {
      google.script.run.withSuccessHandler(res).withFailureHandler(function (e) { rej(new Error((e && e.message) || String(e))); })[fn].apply(null, args);
      return;
    }
    if (!PL.api) { rej(new Error('config.js मध्ये Apps Script ची /exec लिंक टाका')); return; }
    fetch(PL.api, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j.ok) res(j.d); else rej(new Error(j.e)); })
      .catch(function (e) { rej(new Error(e && e.message && e.message.indexOf('LOGIN:') >= 0 ? e.message : 'सर्व्हरशी संपर्क झाला नाही. इंटरनेट तपासा.')); });
  });
}
function call(fn, args, ok, fail) {
  rpc(fn, args).then(ok, function (e) {
    var m = e.message || String(e);
    if (m.indexOf('LOGIN:') >= 0) { logout('लॉगिनची मुदत संपली. पुन्हा लॉगिन करा.'); return; }
    toast(m, true); snd('err'); if (fail) fail(m);
  });
}

/* ---------- तारीख: dd-mm-yyyy टाइप करा किंवा 📅 कॅलेंडर ---------- */
function isoOk(s) { if (!/^\d{4}-\d\d-\d\d$/.test(s)) return false; var d = new Date(s + 'T00:00:00Z'); return !isNaN(d) && d.toISOString().slice(0, 10) === s; }

    '<button type="button" class="dbtn" tabindex="-1" title="कॅलेंडरमधून निवडा">' + ic('cal', 's') + '</button><input type="date" class="dnat" tabindex="-1" aria-hidden="true"' + (mx ? ' max="' + mx + '"' : '') + ' value="' + esc(iso) + '">' +
    '<input type="hidden" name="' + name + '" value="' + esc(iso) + '"></span><span class="hint" data-dterr></span></label>';
}
function wireDates(root) {
  qa(root, '.dfld').forEach(function (w) {
    if (w._w) return; w._w = 1;
    var t = w.querySelector('.dtxt'), n = w.querySelector('.dnat'), h = w.querySelector('input[type=hidden]'), er = w.parentNode.querySelector('[data-dterr]');
    function set(iso, keepTxt) {
      var old = h.value; h.value = iso; n.value = iso; if (!keepTxt) t.value = fmtD(iso);
      if (old !== iso) h.dispatchEvent(new Event('change'));
    }
    function msg(m) { if (er) { er.textContent = m; er.className = 'hint' + (m ? ' w' : ''); } }
    t.addEventListener('input', function () {
      var d = t.value.replace(/\D/g, '').slice(0, 8), v = d.length > 4 ? d.slice(0, 2) + '-' + d.slice(2, 4) + '-' + d.slice(4) : d.length > 2 ? d.slice(0, 2) + '-' + d.slice(2) : d;
      if (t.value !== v) t.value = v;
      if (d.length < 8) { set('', true); msg(''); return; }
      var iso = d.slice(4) + '-' + d.slice(2, 4) + '-' + d.slice(0, 2);
      if (!isoOk(iso)) { set('', true); msg('चुकीची तारीख'); }
      else if (n.max && iso > n.max) { set('', true); msg('पुढची तारीख चालत नाही'); }
      else { set(iso, true); msg(''); }
    });
    t.addEventListener('blur', function () { var d = t.value.replace(/\D/g, ''); if (d.length === 6) { t.value = d.slice(0, 4) + '20' + d.slice(4); t.dispatchEvent(new Event('input')); } });
    w.querySelector('.dbtn').onclick = function () { try { n.showPicker(); } catch (e) { n.focus(); n.click(); } };
    n.addEventListener('change', function () { if (n.value) { set(n.value); msg(''); } });
  });
}

function kalamSplit(s) { var m = /^(.*[\d)])\s+([^\d()]+)$/.exec(String(s || '').trim()); return m ? [m[1].trim(), m[2].trim()] : null; }

      var b = this; b._busy = 1; b.disabled = true; var n = 0;
      (function next(k) {
        if (k >= ok.length) { b._busy = 0; prep(); renderShell(); render(); cacheSave(); sum(); toast(n + ' नवीन गुन्हे जोडले'); snd('done'); return; }

        }, function (e) { c.err = e.message || String(e); el.classList.remove('saving'); draw(c); next(k + 1); });
