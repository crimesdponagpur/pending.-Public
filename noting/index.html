  modal('<h3>' + esc(W.name) + '</h3><div class="mlist">' + it.map(function (x) { return '<button data-m="' + x[0] + '">' + esc(x[1]) + '</button>'; }).join('') + '</div><p class="mut sm">रंग: <i class="lg s-BELA"></i>बेला <i class="lg s-BORI"></i>बोरी <i class="lg s-MIDC"></i>MIDC <i class="lg s-hand"></i>SDPO <i class="lg s-carry"></i>आपोआप (मागील / तत्सम) <i class="lg s-pl"></i>MCR ॲपवरून' + (W.all ? '' : ' <i class="lg my"></i>तुमच्या चौकटी') + '</p>', function (ov, close) {
    Array.prototype.forEach.call(ov.querySelectorAll('[data-m]'), function (b) {
      b.onclick = function () {
        close(); var m = b.dataset.m;
        if (m === 'xl') exportXl(false);
        else if (m === 'brk') { var s = visSheets().filter(function (S) { return /^BREAK UP\s*$/i.test(S.x); })[0]; if (s) { NB.sheet = s.x; NB.sel = ''; tabs(); grid(); } }
        else if (m === 'st') status();
        else if (m === 'cl') closeDlg();
        else if (m === 'ro') reopen();
        else if (m === 'su') setupDlg();
        else if (m === 'rl') flush(true).then(function () { NB.hist = {}; load(NB.ym); });
        else if (m === 'lo') flush(true).then(function () { logout(); });
      };
    });
  });
}
function status() {
  var tot = {}, done = {}, last = {};
  NB_PS.forEach(function (p) { tot[p] = 0; done[p] = 0; last[p] = ''; Object.keys(NB.ownPs[p] || {}).forEach(function (s) { tot[p] += NB.ownPs[p][s].length; }); });
  Object.keys(NB.by).forEach(function (k) { var o = NB.by[k], p = NB.own[k]; if (p && o.why === p) { done[p]++; if (String(o.at) > last[p]) last[p] = String(o.at); } });
  modal('<h3>' + monL(NB.ym) + ': पो.स्टे. भरणा</h3><table class="st"><tr><th>पो.स्टे.</th><th>भरलेल्या चौकटी</th><th>शेवटची नोंद</th></tr>' +
    NB_PS.map(function (p) { return '<tr><td><i class="lg s-' + p + '"></i>' + NB_PSM[p] + '</td><td>' + done[p] + ' / ' + tot[p] + '</td><td>' + esc(last[p].slice(5, 16) || '–') + '</td></tr>'; }).join('') +
    '</table><p class="mut sm">शून्य असलेल्या चौकटी रिकाम्या ठेवल्या तरी चालतात; फक्त आकडा असलेल्या भराव्या.</p><div class="row end"><button class="btn" data-close>ठीक</button></div>');
}

/* ---------- Excel डाउनलोड, महिना बंद ---------- */
function inputs() { var o = {}; Object.keys(NB.set).forEach(function (k) { var i = k.indexOf('!'), sh = k.slice(0, i); (o[sh] = o[sh] || {})[k.slice(i + 1)] = NB.set[k]; }); return o; }
function exportXl(forClose) {
  toast('Excel बनवत आहे…');
  return script(NB_ZIP, 'JSZip').then(function () { return NX.build(JSZip, NB.tpl, NB.eng, inputs()); })
    .then(function (zip) { return zip.generateAsync({ type: forClose ? 'arraybuffer' : 'blob', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }); })
    .then(function (out) {
      if (forClose) return out;
      var name = 'NOTING_BREAKUP_' + NB.ym.slice(5, 7) + '-' + NB.ym.slice(2, 4) + '.xlsx', a = document.createElement('a');
      a.href = URL.createObjectURL(out); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
      toast(name + ' डाउनलोड झाली');
    }, function (e) { toast('Excel बनवताना अडचण: ' + (e.message || e), true); throw e; });
}
/* बंद करताना जतन: पुढच्या महिन्यासाठी लागणारे आकडे (v) व नमुन्यापेक्षा वेगळे हाताने भरलेले (d) */
function snapshot() {
  var E = NB.eng, v = {}, d = {};
  function pv(sh, a) { var x = E.get(sh, a); if (typeof x === 'number' && x !== 0) (v[sh] = v[sh] || {})[a] = x; }
  NB.carry.forEach(function (c) { pv(c[0], c[2]); });
  Object.keys(NB_RULES).forEach(function (sh) { var S = NB.S[sh]; if (!S) return; var R = NB_RULES[sh], cols = {}; Object.keys(R).forEach(function (c) { cols[R[c][1]] = 1; });
    var max = 0; Object.keys(S.v).concat(Object.keys(S.f)).forEach(function (a) { var r = +/\d+$/.exec(a)[0]; if (r > max) max = r; });
    Object.keys(cols).forEach(function (c) { for (var r = 1; r <= max; r++) pv(sh, c + r); }); });
  Object.keys(NB.set).forEach(function (k) { var i = k.indexOf('!'), sh = k.slice(0, i), a = k.slice(i + 1), x = NB.set[k], t = tplVal(sh, a); if (x === t || (x == null && t == null)) return; (d[sh] = d[sh] || {})[a] = x == null ? null : x; });
  return { v: v, d: d, at: new Date().toISOString() };
}
function closeDlg() {
  modal('<h3>' + monL(NB.ym) + ' बंद करायचा?</h3><p>बंद केल्यावर:</p><ul><li>या महिन्याची Excel Drive मध्ये जतन होते</li><li>पो.स्टे. बदल करू शकत नाहीत (SDPO करू शकते)</li><li>' + monL(addM(NB.ym, 1)) + ' आपोआप तयार: बेरीज पुढे, मागील महिना व तत्सम रकाने भरलेले, चालू महिन्याच्या चौकटी रिकाम्या</li></ul><p class="mut sm">गरज पडल्यास पुन्हा उघडता येतो; पुन्हा बंद केल्यावर पुढचा महिना नव्या आकड्यांवरून.</p>' +
    '<div class="row end"><button class="btn" data-close>रद्द</button><button class="btn p" id="mc">🔒 महिना बंद करा</button></div>', function (ov, close) {
    $('mc').onclick = function () {
      $('mc').disabled = true; $('mc').textContent = 'जतन करत आहे…';
      var ym = NB.ym, h = {}; h[ym] = snapshot();
      flush(true).then(function () { return rpc('nfAct', [NB.tok, 'hput', { h: h }]); })
        .then(function () { NB.hist[ym] = h[ym]; return exportXl(true); })
        .then(function (buf) { return rpc('ntAct', [NB.tok, 'close', { ym: ym, b64: b64(buf) }]); })
        .then(function () { close(); toast(monL(ym) + ' बंद केला. Excel Drive मध्ये जतन.'); load(ym); }, function (e) { close(); toast(e.message || String(e), true); });
    };
  });
}
function reopen() {
  modal('<h3>' + monL(NB.ym) + ' पुन्हा उघडायचा?</h3><p class="mut">पो.स्टे. पुन्हा बदल करू शकतील. बदल झाल्यावर महिना पुन्हा बंद करा, म्हणजे पुढचा महिना नव्या आकड्यांवरून तयार होईल.</p><div class="row end"><button class="btn" data-close>रद्द</button><button class="btn p" id="mo">🔓 उघडा</button></div>', function (ov, close) {
    $('mo').onclick = function () { close(); rpc('ntAct', [NB.tok, 'reopen', { ym: NB.ym }]).then(function () { toast('महिना उघडला'); load(NB.ym); }, function (e) { toast(e.message, true); }); };
  });
}

/* ---------- सेटअप (SDPO) ---------- */
function pubOwn() {
  var ps = {}; NB_PS.forEach(function (p) { ps[p] = NB.ownPs[p]; });
  rpc('nfAct', [NB.tok, 'own', { own: { tid: NB.d.tpl.id + '|' + NB.d.tpl.at, ps: ps } }]).then(function (r) { NB.d.own = { tid: NB.d.tpl.id + '|' + NB.d.tpl.at, at: r.at }; }, function (e) { toast('पो.स्टे.च्या चौकटी जतन झाल्या नाहीत: ' + e.message, true); });
}
function setupHtml() {
  var d = NB.d, W = NB.who;
  if (!W.admin) return '<div class="card"><h3>Noting ॲप अजून तयार नाही</h3><p>SDPO कार्यालयाने Noting ची Excel फाइल ॲपमध्ये एकदा जोडल्यावर इथे पत्रके दिसतील.</p></div>';
  return '<div class="card"><h3>सुरुवात (एकदाच)</h3>' + setupBody() + '</div>';
}
function setupBody() {
  var d = NB.d, hs = d.hist || [];
  return '<p><b>1. नमुना Excel</b>: शेवटच्या पूर्ण महिन्याची Noting फाइल (उदा. NOTING_BREAKUP_ND_09-26.xlsx). पुढचे सर्व महिने हिच्यावरून.</p>' +
    (d.tpl ? '<p class="mut sm">आत्ताची: ' + esc(d.tpl.name) + ' (' + (d.tpl.ym ? monL(d.tpl.ym) : 'महिना नाही') + ', ' + esc(d.tpl.at) + ')</p>' : '') +
    '<div class="row"><input type="file" id="tf" accept=".xlsx"><select id="tm">' + (function () { var o = '', c = today().slice(0, 7); for (var i = -12; i <= 0; i++) { var y = addM(c, i); o += '<option value="' + y + '"' + (y === addM(c, -1) ? ' selected' : '') + '>' + monL(y) + '</option>'; } return o; })() + '</select><button class="btn p" id="tu">जोडा</button></div>' +
    '<p><b>2. जुन्या महिन्यांचा इतिहास</b> (तत्सम व मागील महिन्यासाठी): "Noting_इतिहास_….json" फाइल.</p>' +
    '<p class="mut sm">जतन असलेले महिने: ' + (hs.length ? hs.map(monL).join(', ') : 'एकही नाही') + '</p>' +
    '<div class="row"><input type="file" id="hf" accept=".json"><button class="btn p" id="hu">जोडा</button></div>';
}
function wireSetup() {
  if (!$('tu')) return;
  var m = /(\d\d)[-_ .](\d\d)\.xlsx$/i;
  $('tf').onchange = function () { var f = this.files[0], x = f && m.exec(f.name); if (x) { var y = '20' + x[2] + '-' + x[1]; if ($('tm').querySelector('option[value="' + y + '"]')) $('tm').value = y; } };
  $('tu').onclick = function () {
    var f = $('tf').files[0]; if (!f) return toast('Excel फाइल निवडा', true);
    var b = this; b.disabled = true; b.textContent = 'पाठवत आहे…';
    f.arrayBuffer().then(function (buf) { return rpc('ntAct', [NB.tok, 'tpl', { b64: b64(buf), name: f.name, ym: $('tm').value }]); })
      .then(function () { toast('नमुना जोडला'); NB.eng = null; NB.ym = ''; NB.hist = {}; closeOv(); load(); }, function (e) { b.disabled = false; b.textContent = 'जोडा'; toast(e.message, true); });
  };
  $('hu').onclick = function () {
    var f = $('hf').files[0]; if (!f) return toast('JSON फाइल निवडा', true);
    var b = this; b.disabled = true; b.textContent = 'पाठवत आहे…';
    f.text().then(function (t) { var j = JSON.parse(t); if (j.kind !== 'noting-history' || !j.h) throw new Error('ही इतिहासाची फाइल नाही'); return rpc('nfAct', [NB.tok, 'hput', { h: j.h }]); })
      .then(function (r) { toast(r.n + ' महिन्यांचा इतिहास जतन'); NB.hist = {}; closeOv(); load(NB.ym); }, function (e) { b.disabled = false; b.textContent = 'जोडा'; toast(e.message, true); });
  };
}
function closeOv() { var o = document.querySelector('.ov'); if (o) o.remove(); }
function setupDlg() { modal('<h3>सेटअप</h3>' + setupBody() + '<div class="row end"><button class="btn" data-close>बंद</button></div>', function () { wireSetup(); }); }

boot();
if ("serviceWorker" in navigator) window.addEventListener("load", function () { var hc = !!navigator.serviceWorker.controller; navigator.serviceWorker.register("sw.js"); navigator.serviceWorker.addEventListener("controllerchange", function () { if (hc && !Object.keys(NB.q).length) location.reload(); }); });
</script></body></html>
